        {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"name":"db-replica","namespace":"default"},"spec":{"replicas":1,"selector":{"matchLabels":{"app":"db-replica"}},"template":{"metadata":{"labels":{"app":"db-replica","role":"replica"}},"spec":{"containers":[{"env":[{"name":"POSTGRES_DB","value":"judge0"},{"name":"POSTGRES_USER","value":"judge0"},{"name":"POSTGRES_PASSWORD","valueFrom":{"secretKeyRef":{"key":"POSTGRES_PASSWORD","name":"judge0-env"}}}],"image":"postgres:16-alpine","name":"db-replica","ports":[{"containerPort":5432,"name":"postgres"}],"resources":{"limits":{"cpu":"500m","memory":"512Mi"},"requests":{"cpu":"100m","memory":"256Mi"}},"volumeMounts":[{"mountPath":"/var/lib/postgresql/data","name":"vol-db-replica"}]}],"initContainers":[{"command":["sh","-c","set -e\n\nif [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then\n  echo \"Copiando banco do PostgreSQL Primary...\"\n\n  chown -R 70:70 /var/lib/postgresql/data\n\n  su-exec postgres pg_basebackup \\\n    -h db \\\n    -p 5432 \\\n    -U replicator \\\n    -D /var/lib/postgresql/data \\\n    -Fp \\\n    -Xs \\\n    -P\n\n  echo \"db:5432:*:replicator:$PGPASSWORD\" \\\n    \u003e /var/lib/postgresql/data/.pgpass\n\n  chown 70:70 /var/lib/postgresql/data/.pgpass\n  chmod 600 /var/lib/postgresql/data/.pgpass\n\n  touch /var/lib/postgresql/data/standby.signal\n\n  echo \"primary_conninfo = 'host=db port=5432 user=replicator passfile=/var/lib/postgresql/data/.pgpass application_name=db-replica'\" \\\n    \u003e\u003e /var/lib/postgresql/data/postgresql.auto.conf\n\n  chown -R 70:70 /var/lib/postgresql/data\n\n  echo \"Replica preparada.\"\nelse\n  echo \"Banco existente encontrado. Clone nao necessario.\"\nfi\n"],"env":[{"name":"PGPASSWORD","valueFrom":{"secretKeyRef":{"key":"POSTGRES_REPLICATION_PASSWORD","name":"postgres-replication"}}}],"image":"postgres:16-alpine","name":"clone-primary","volumeMounts":[{"mountPath":"/var/lib/postgresql/data","name":"vol-db-replica"}]}],"nodeSelector":{"kubernetes.io/arch":"amd64","kubernetes.io/hostname":"srv-kube-worker-2"},"volumes":[{"name":"vol-db-replica","persistentVolumeClaim":{"claimName":"postgres-replica-data"}}]}}}}
    creationTimestamp: "2026-10-15T20:09:49Z"
    generation: 1
    name: db-replica
    namespace: default
    resourceVersion: "5187356"
    uid: 4995d2ae-7caf-4ae6-8f87-bd11a6b19ce5
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: db-replica
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        creationTimestamp: null
        labels:
          app: db-replica
          role: replica
      spec:
        containers:
        - env:
          - name: POSTGRES_DB
            value: judge0
          - name: POSTGRES_USER
            value: judge0
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: POSTGRES_PASSWORD
                name: judge0-env
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          name: db-replica
          ports:
          - containerPort: 5432
            name: postgres
            protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: vol-db-replica
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - |
            set -e

            if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
              echo "Copiando banco do PostgreSQL Primary..."

              chown -R 70:70 /var/lib/postgresql/data

              su-exec postgres pg_basebackup \
                -h db \
                -p 5432 \
                -U replicator \
                -D /var/lib/postgresql/data \
                -Fp \
                -Xs \
                -P

              echo "db:5432:*:replicator:$PGPASSWORD" \
                > /var/lib/postgresql/data/.pgpass

              chown 70:70 /var/lib/postgresql/data/.pgpass
              chmod 600 /var/lib/postgresql/data/.pgpass

              touch /var/lib/postgresql/data/standby.signal

              echo "primary_conninfo = 'host=db port=5432 user=replicator passfile=/var/lib/postgresql/data/.pgpass application_name=db-replica'" \
                >> /var/lib/postgresql/data/postgresql.auto.conf

              chown -R 70:70 /var/lib/postgresql/data

              echo "Replica preparada."
            else
              echo "Banco existente encontrado. Clone nao necessario."
            fi
          env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                key: POSTGRES_REPLICATION_PASSWORD
                name: postgres-replication
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          name: clone-primary
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: vol-db-replica
        nodeSelector:
          kubernetes.io/arch: amd64
          kubernetes.io/hostname: srv-kube-worker-2
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - name: vol-db-replica
          persistentVolumeClaim:
            claimName: postgres-replica-data
