# Redis mestre persistido em AOF/PVC. O serviço redis-node-1 é o endpoint
# inicial monitorado pelo Sentinel; esta instância não deve usar --replicaof.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis
        role: primary

    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: srv-kube-worker-2

      containers:
        - name: redis
          image: redis:7.2.4

          command:
            - "sh"
            - "-c"

          args:
            - |
              exec docker-entrypoint.sh \
                --appendonly yes \
                --requirepass "$REDIS_PASSWORD"

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: judge0-env
                  key: REDIS_PASSWORD

          ports:
            - containerPort: 6379
              name: redis

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning ping | grep -q PONG'
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3

          volumeMounts:
            - name: redis-data
              mountPath: /data

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
