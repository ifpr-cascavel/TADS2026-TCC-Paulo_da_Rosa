# Segundo Sentinel em worker distinto; participa da maioria para failover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel-2
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis-sentinel
      sentinel-id: "2"

  template:
    metadata:
      labels:
        app: redis-sentinel
        sentinel-id: "2"

    spec:
      nodeSelector:
        kubernetes.io/hostname: srv-kube-worker-1

      # tolerations:
      #   - key: node-role.kubernetes.io/worker
      #     operator: Exists
      #     effect: NoSchedule

      containers:
        - name: sentinel
          image: redis:7.2.4
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - /bootstrap/start-sentinel.sh

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: judge0-env
                  key: REDIS_PASSWORD

          ports:
            - name: sentinel
              containerPort: 26379

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            tcpSocket:
              port: 26379
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 26379
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true

            - name: sentinel-data
              mountPath: /data

      volumes:
        - name: bootstrap
          configMap:
            name: redis-sentinel-bootstrap
            defaultMode: 0555

        - name: sentinel-data
          emptyDir: {}
